<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <meta name="description" content="Contact Japhet's Wings.">
  <title>Japhet's Wings — Contact</title>

  <link rel="icon" href="/public_html/images/favicon.svg" type="image/svg+xml">
  <link rel="stylesheet" href="/css/style.css">
</head>
<body>
  <a class="skip-link" href="#main">Skip to content</a>
  <header class="site-header" id="site-header">
    <div class="container header-inner">
      <div class="brand"><a href="/index.html"><img src="/public_html/images/logo.svg" alt="Logo" class="logo" /></a></div>
      <nav class="nav" aria-label="Primary"><ul class="nav-list" id="primary-menu"><li><a href="/index.html">Home</a></li><li><a href="/about.html">About</a></li><li><a href="/portfolio.html">Portfolio</a></li><li><a href="/contact.html" aria-current="page">Contact</a></li></ul></nav>
      <div class="header-cta"><a href="/contact.html" class="btn btn-primary">Contact</a></div>
    </div>
  </header>

  <main id="main" class="container">
    <section class="section">
      <header class="section-header"><h1>Contact</h1><p class="muted">Start a conversation about your project.</p></header>

      <div class="contact-grid">
        <form id="contact-form" class="contact-form">
          <label>Name<input type="text" name="name" placeholder="Your name" required></label>
          <label>Email<input type="email" name="email" placeholder="you@company.com" required></label>
          <label>Message<textarea name="message" placeholder="Tell us about your project" rows="6" required></textarea></label>
          <div class="form-actions"><button class="btn btn-primary" type="submit">Send Message</button></div>
          <p id="form-status" class="muted"></p>
        </form>

        <div class="contact-info">
          <h3>Get in touch</h3>
          <p class="muted">hello@japhetswings.example</p>
          <p>We typically respond within 2 business days.</p>
        </div>
      </div>
    </section>
  </main>

  <footer class="site-footer"><div class="container footer-inner"><div class="brand-footer"><img src="/public_html/images/logo.svg" alt="Japhet's Wings logo" class="logo-sm" /><p class="muted">Engineering digital innovation.</p></div></div></footer>

  <script src="/js/script.js" defer></script>
</body>
</html>
